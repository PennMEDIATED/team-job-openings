<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Openings | Penn MEDIATED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Job Openings ─────────────────────────────────────────────
       Content matches the "Employment Opportunities with Penn
       MEDIATED" iframe embedded on the live mediated.upenn.edu/team-job-openings/
       page — heading and status message only. The surrounding
       WordPress nav/menu bar and site footer (newsletter signup,
       funder logos, social links, address) are page chrome supplied
       by the WordPress wrapper, not part of this embed, so they are
       intentionally not reproduced here — same convention as the
       `about` and `home` repos, which don't include their own
       nav/footer either. -->
  <section class="openings reveal" aria-labelledby="openings-heading">
    <div class="openings__inner">
      <h2 id="openings-heading" class="openings__title">Employment Opportunities with Penn MEDIATED</h2>
      <p class="openings__lead">We have no current job openings &#8212; please check back soon!</p>
    </div>
  </section>

  <script>
    // Progressive enhancement: only hide .reveal sections (via the
    // .js-reveal-ready CSS rule) once we know this script can actually
    // run — so a page with JS blocked or failing never gets stuck with
    // permanently invisible content; it just renders normally instead.
    // Same pattern as the `about` and `home` repos.
    document.documentElement.classList.add('js-reveal-ready');

    var revealEls = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      var revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      revealEls.forEach(function (el) { revealObserver.observe(el); });
    } else {
      revealEls.forEach(function (el) { el.classList.add('is-visible'); });
    }
  </script>


  <!-- Auto-resize when embedded: posts this page's height to the parent so an
       <iframe> can size itself to the content instead of guessing a fixed
       height. No-op when the page is opened directly. Every Penn MEDIATED repo
       sends the same { frameHeight } message — see the README. -->
  <script>
    (function () {
      if (window.self === window.top) return;
      function sendHeight() {
        var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
        window.parent.postMessage({ frameHeight: Math.ceil(h) }, '*');
      }
      window.addEventListener('load', sendHeight);
      window.addEventListener('resize', sendHeight);
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(sendHeight); }
      if (window.ResizeObserver) { new ResizeObserver(sendHeight).observe(document.body); }
    })();
  </script>
</body>
</html>
